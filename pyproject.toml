[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-fleet"
version = "0.1.0"
description = "Autonomous medical-conference sponsor lead pipeline (Spark Fleet)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "httpx>=0.27",        # required by FastAPI TestClient
]
pdf = [
    "PyMuPDF>=1.24",
]
proxycurl = [
    # No extra pip package — the Proxycurl adapter uses httpx (already a core dep).
    # Install your API key via the PROXYCURL_API_KEY environment variable.
]
playwright = [
    "playwright>=1.40",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
